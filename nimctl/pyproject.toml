[project]
name = "nimctl"
version = "0.5.0"
description = "CLI for F5 NGINX Instance Manager"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "typer>=0.12", "click>=8.1", "tomli-w>=1.0"]

[project.scripts]
nimctl = "nimctl.cli:run"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyinstaller>=6.11",
    "mkdocs>=1.6.1",
    "mkdocs-material[imaging]>=9.7.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nimctl"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
